[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-rag-review"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.23,<0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.14,<0.15",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]